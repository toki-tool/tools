<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仮URL残りチェックツール</title>

<style>
* { box-sizing:border-box; }

:root {
  --card:#fff;
  --text:#222;
  --sub:#666;
  --line:#e7e7ef;
  --accent:#5b7cfa;
  --accent-weak:#eef2ff;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --radius:18px;
  --ok:#1f8f5f;
  --warn:#b7791f;
  --ng:#d64545;
}

body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#f8f9ff 0%,#f5f5fa 100%);
  color:var(--text);
}

.wrap {
  max-width:1100px;
  margin:0 auto;
  padding:32px 16px 48px;
}

.back {
  display:inline-block;
  margin-bottom:20px;
  color:var(--accent);
  text-decoration:none;
  font-weight:700;
}

.title {
  font-size:32px;
  font-weight:800;
  margin:0 0 10px;
}

.lead {
  color:var(--sub);
  line-height:1.8;
}

.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

input, select {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  margin-top:10px;
  font-size:16px;
}

button {
  margin-top:12px;
  padding:10px 14px;
  border:none;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.secondary {
  background:var(--accent-weak);
  color:var(--accent);
}

.status {
  margin-top:10px;
  padding:10px;
  background:#f9f9ff;
  border-radius:10px;
  color:var(--sub);
}

.progress-wrap {
  margin-top:10px;
  background:#edf0f7;
  border-radius:999px;
  overflow:hidden;
  height:10px;
}

.progress-bar {
  width:0%;
  height:100%;
  background:var(--accent);
  transition:width .2s ease, background .2s ease;
}

.summary-ok {
  border-left:8px solid var(--ok);
}

.summary-ng {
  border-left:8px solid var(--ng);
}

.summary-warn {
  border-left:8px solid var(--warn);
}

.summary-title {
  font-size:24px;
  font-weight:900;
  margin-bottom:8px;
}

.ok { color:var(--ok); font-weight:800; }
.warn { color:var(--warn); font-weight:800; }
.ng { color:var(--ng); font-weight:800; }

.table-wrap {
  overflow-x:auto;
}

table {
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th, td {
  border:1px solid #e5e7eb;
  padding:10px;
  vertical-align:top;
  overflow-wrap:anywhere;
  word-break:break-word;
}

th {
  background:#f3f4ff;
}

th:nth-child(1), td:nth-child(1) { width:28%; }
th:nth-child(2), td:nth-child(2) { width:52%; }
th:nth-child(3), td:nth-child(3) { width:20%; }

.note {
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
}

@media print {
  .no-print { display:none !important; }
  body { background:#fff; font-size:10px; }
  .wrap { max-width:none; padding:0; }
  .card { box-shadow:none; border:1px solid #ccc; padding:10px; margin-bottom:10px; }
  th, td { font-size:9px; padding:5px; }
}
</style>
</head>

<body>
<div class="wrap">

<a href="./" class="back no-print">← ツール一覧に戻る</a>

<h1 class="title">仮URL残りチェックツール</h1>
<p class="lead no-print">
  本番サイト内に、仮構築場URLが残っていないか確認します。
</p>

<div class="card no-print">
  <input id="siteUrl" placeholder="チェックしたい本番URL（例：https://example.com/）">
  <input id="keyword" placeholder="探したい仮構築場URL（例：https://test.example.com/）">

  <select id="limit">
    <option value="30">取得ページ数：30ページ（軽い）</option>
    <option value="50">取得ページ数：50ページ</option>
    <option value="100" selected>取得ページ数：100ページ（おすすめ）</option>
    <option value="200">取得ページ数：200ページ（重い）</option>
    <option value="500">取得ページ数：500ページ（かなり重い）</option>
  </select>

  <div class="actions">
    <button id="runBtn">チェックする</button>
    <button class="secondary" id="copyBtn">結果をコピー</button>
    <button class="secondary" onclick="window.print()">PDF</button>
  </div>

  <div id="status" class="status">未実行</div>
  <div class="progress-wrap">
    <div id="progressBar" class="progress-bar"></div>
  </div>
</div>

<div id="summary"></div>
<div id="result"></div>

</div>

<script>
const WORKER = "https://seo-tool.geass1127.workers.dev/";

let checkedData = [];
let hitData = [];
let errorCount = 0;
let totalFound = 0;
let selectedLimit = 100;
let targetKeyword = "";
let targetSite = "";

const siteUrlInput = document.getElementById("siteUrl");
const keywordInput = document.getElementById("keyword");
const progressBar = document.getElementById("progressBar");

document.getElementById("runBtn").onclick = run;
document.getElementById("copyBtn").onclick = copyResult;

[siteUrlInput, keywordInput].forEach(input => {
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      run();
    }
  });
});

async function run() {
  const siteUrl = siteUrlInput.value.trim();
  const keyword = keywordInput.value.trim();
  const limit = document.getElementById("limit").value;

  if (!siteUrl) return alert("本番URLを入力してね！");
  if (!keyword) return alert("探したい仮構築場URLを入力してね！");

  checkedData = [];
  hitData = [];
  errorCount = 0;
  totalFound = 0;
  selectedLimit = limit;
  targetKeyword = keyword;
  targetSite = siteUrl;

  updateProgress(0);

  document.getElementById("status").innerText = "サイト構造を取得中...";
  document.getElementById("summary").innerHTML = "";
  document.getElementById("result").innerHTML = "";

  try {
    const sitemapRes = await fetch(`${WORKER}?mode=sitemap&url=${encodeURIComponent(siteUrl)}&limit=${limit}`);
    const sitemapJson = await sitemapRes.json();
    const urls = sitemapJson.urls || [];

    totalFound = sitemapJson.totalFound || urls.length;

    if (!urls.length) {
      document.getElementById("status").innerText = "URLを取得できませんでした。";
      renderSummary();
      return;
    }

    for (let i = 0; i < urls.length; i++) {
      const pageUrl = urls[i];

      try {
        const res = await fetch(`${WORKER}?mode=contains&url=${encodeURIComponent(pageUrl)}&keyword=${encodeURIComponent(keyword)}`);
        const data = await res.json();

        checkedData.push(data);

        if (data.found) {
          hitData.push(data);
        }

      } catch (e) {
        errorCount++;

        checkedData.push({
          url: pageUrl,
          title: "",
          found: false,
          error: e.message || "取得失敗"
        });
      }

      const percent = Math.floor(((i + 1) / urls.length) * 100);
      updateProgress(percent);

      document.getElementById("status").innerText =
        `確認中 (${i + 1}/${urls.length}) / ${percent}% / 検出 ${hitData.length}件 / 失敗 ${errorCount}件`;

      renderSummary();
      renderResult();
    }

    updateProgress(100);

    document.getElementById("status").innerText =
      `完了！ ${checkedData.length}件確認 / 検出 ${hitData.length}件 / 失敗 ${errorCount}件`;

  } catch (e) {
    document.getElementById("status").innerText = "取得に失敗しました。";
    document.getElementById("summary").innerHTML = `
      <div class="card summary-ng">
        <div class="summary-title ng">チェック失敗</div>
        <div>${escapeHtml(e.message || "取得失敗")}</div>
      </div>
    `;
  }
}

function renderSummary() {
  const hasHit = hitData.length > 0;
  const summaryClass = hasHit ? "summary-ng" : errorCount ? "summary-warn" : "summary-ok";
  const summaryLabel = hasHit ? "仮URLが残っています" : errorCount ? "一部確認できませんでした" : "仮URL残りなし";
  const summaryText = hasHit
    ? `${hitData.length}ページで仮構築場URLを検出しました。`
    : errorCount
      ? `仮URLは検出されませんでしたが、${errorCount}ページは確認できませんでした。`
      : "確認した範囲では、仮構築場URLは検出されませんでした。";

  document.getElementById("summary").innerHTML = `
    <div class="card ${summaryClass}">
      <div class="summary-title ${hasHit ? "ng" : errorCount ? "warn" : "ok"}">${summaryLabel}</div>
      <div>${escapeHtml(summaryText)}</div>
      <div class="note" style="margin-top:10px;">
        検出URL数：${totalFound}件 / 確認ページ数：${checkedData.length}件 / 取得上限：${selectedLimit}件 / 取得失敗：${errorCount}件
      </div>
      <div class="note" style="margin-top:6px;">
        検索文字列：${escapeHtml(targetKeyword)}
      </div>
    </div>
  `;
}

function renderResult() {
  if (!hitData.length) {
    document.getElementById("result").innerHTML = `
      <div class="card">
        <h2>検出ページ</h2>
        <p class="ok">現在のところ、仮URLは検出されていません。</p>
      </div>
    `;
    return;
  }

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>検出ページ</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>タイトル</th>
              <th>URL</th>
              <th>ステータス</th>
            </tr>
          </thead>
          <tbody>
            ${hitData.map(d => `
              <tr>
                <td>${escapeHtml(d.title || "タイトルなし")}</td>
                <td>${escapeHtml(d.url || "")}</td>
                <td><span class="ng">仮URL検出</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function copyResult() {
  if (!checkedData.length) return alert("先にチェックしてね！");

  let text = "";
  text += "仮URL残りチェック結果\n";
  text += `本番URL\t${targetSite}\n`;
  text += `検索文字列\t${targetKeyword}\n`;
  text += `検出URL数\t${totalFound}\n`;
  text += `確認ページ数\t${checkedData.length}\n`;
  text += `検出ページ数\t${hitData.length}\n`;
  text += `取得失敗\t${errorCount}\n\n`;

  text += "タイトル\tURL\t結果\n";

  if (hitData.length) {
    text += hitData.map(d =>
      `${cleanForSheet(d.title || "タイトルなし")}\t${cleanForSheet(d.url || "")}\t仮URL検出`
    ).join("\n");
  } else {
    text += `-\t-\t仮URL検出なし`;
  }

  await navigator.clipboard.writeText(text);
  alert("コピーしたよ！");
}

function updateProgress(percent) {
  progressBar.style.width = percent + "%";

  if (percent < 50) {
    progressBar.style.background = "#5b7cfa";
  } else if (percent < 80) {
    progressBar.style.background = "#f59e0b";
  } else {
    progressBar.style.background = "#10b981";
  }
}

function cleanForSheet(str = "") {
  return String(str)
    .replace(/\t/g, " ")
    .replace(/\r?\n/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function escapeHtml(str = "") {
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[s]));
}
</script>

</body>
</html>
